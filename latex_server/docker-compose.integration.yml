
services:
  portrai_latex_server:
    profiles: [backend,latex]
    build:
      context: .
      dockerfile: dockerfile.dev
    container_name: portrai_latex_server
    networks:
      - back
    restart: unless-stopped
    ports:
      - "3780:3780"
    environment:
      KONG_AUTH_HOST : ${KONG_AUTH_HOST}
      KONG_AUTH_PORT : ${KONG_AUTH_PORT}
      SERVICE_ROLE_KEY : ${SERVICE_ROLE_KEY}
      JWT_SECRET : ${JWT_SECRET}
      PORT : 3780
    volumes:
      - ./latex_logs:/tmp
