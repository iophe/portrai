include:
  - supabase/docker-compose.supabase.yml
  - monitoring/docker-compose.monitoring.yml
  - vault/docker-compose.vault.dev.yml
  - cache/docker-compose.cache.yml
  - latex_server/docker-compose.dev.yml

services :
  portrai_backend:
    build:
      context: ./backend
      dockerfile: dockerfile.dev
    container_name: portrai_backend
    profiles: [dev,backend]
    image: portrai_backend:latest
    ports:
      - 3000:3000
    environment:
      PORT : ${BACKEND_PORT}
      LOG_FILEPATH : ${LOG_FILEPATH}
      APP_URL: ${SITE_URL}
      SECURE_COOKIE: ${SECURE_COOKIE}

      # MAILER CONF
      MAILER_SMTP_HOST: ${SMTP_HOST}
      MAILER_SMTP_PORT: ${SMTP_PORT}
      MAILER_SMTP_USERNAME: ${SMTP_USER}
      MAILER_SMTP_PASSWORD: ${SMTP_PASS}


      # DATABASE CONF
      POSTGRES_PASSWORD : ${POSTGRES_PASSWORD}
      POSTGRES_HOST : ${POSTGRES_HOST}
      POSTGRES_DB : ${POSTGRES_DB}
      POSTGRES_PORT : ${POSTGRES_PORT}
      POSTGRES_USER : ${POSTGRES_USER}

      # CACHE CONF
      DRAGONFLY_PASSWORD : ${DRAGONFLY_PASSWORD}
      DRAGONFLY_ADDR : ${DRAGONFLY_ADDR}
      DRAGONFLY_PORT : ${DRAGONFLY_PORT}
      DRAGONFLY_USER : ${DRAGONFLY_USER}

      # SECRETS
      SERVICE_ROLE_KEY : ${SERVICE_ROLE_KEY}
      JWT_SECRET : ${JWT_SECRET}
      PAYMENT_SECRET: ${PAYMENT_SECRET}
      COOKIES_ENCRYPTION_KEY: ${COOKIES_ENCRYPTION_KEY}

      KONG_AUTH_HOST : ${KONG_AUTH_HOST}
      KONG_AUTH_PORT : ${KONG_AUTH_PORT}
      GOTRUE_AUTH_HOST : ${GOTRUE_AUTH_HOST}
      GOTRUE_AUTH_PORT : ${GOTRUE_AUTH_PORT}
      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}

      #Anthropic
      ANTHROPIC_SECRET_KEY: ${ANTHROPIC_SECRET_KEY}