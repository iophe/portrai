services:
  portrai_cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    container_name: portrai_dragonfly
    profiles: [services,cache]
    networks: 
      - back
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - portrai_dragonfly_data:/data
      - ./dragonfly_acl.conf:/cache/dragonfly/acl.conf
    command: ["--aclfile", "/cache/dragonfly/acl.conf"]
    restart: unless-stopped
    user: "1000:1000"

volumes:
  portrai_dragonfly_data: