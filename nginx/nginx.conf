server {
    listen 80;
    server_name portraipreprod.site;

    allow 192.168.208.0/20;    
    allow 172.19.0.0/16;  
    allow 172.22.0.0/16;
    deny all;              

   location /myip {
        add_header Content-Type text/plain;
        return 200 "Client IP: $remote_addr\nX-Forwarded-For: $http_x_forwarded_for\n";
    }

             location / {
        proxy_pass http://portrai_frontend:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://portrai_backend:3000/api/;  
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }


}

