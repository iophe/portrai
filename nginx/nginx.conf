server {
    listen 80;
    server_name portraipreprod.site;

    allow 192.168.64.0/20;    
    allow 172.19.0.0/16;  
    allow 172.26.0.0/16;
    deny all;              

    location /studio/ {
        proxy_pass http://portrai_kong:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect / /studio/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Handle /vault without trailing slash
    location = /vault {
        return 301 $scheme://$host/vault/;
    }

    # For Vault with trailing slash
    location /vault/ {
        add_header X-Debug-Info "Client IP: $remote_addr, VPN Access OK" always;
        proxy_pass http://portrai_vault:8200/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Fix redirects
        proxy_redirect / /vault/;
        proxy_redirect /ui/ /vault/ui/;
        # More extensive content replacement
        sub_filter_once off;
        sub_filter '/ui/' '/vault/ui/';
        sub_filter 'src="/ui/' 'src="/vault/ui/';
        sub_filter 'href="/ui/' 'href="/vault/ui/';
        sub_filter '"rootURL":"/ui/"' '"rootURL":"/vault/ui/"';
    }

    # Special location for handling assets directly
    location ~ ^/ui/(.*)$ {
        # Rewrite the request to the vault backend
        proxy_pass http://portrai_vault:8200/ui/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Special handling for UI assets
    location /vault/ui/ {
        proxy_pass http://portrai_vault:8200/ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle API calls
    location /vault/v1/ {
        proxy_pass http://portrai_vault:8200/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

   location /myip {
        add_header Content-Type text/plain;
        return 200 "Client IP: $remote_addr\nX-Forwarded-For: $http_x_forwarded_for\n";
    }


}