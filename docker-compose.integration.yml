version: '3.8'

include:
  - supabase/docker-compose.supabase-integration.yml
  - monitoring/docker-compose.monitoring.yml
  - vault/docker-compose.vault.integration.yml
  - cache/docker-compose.cache.yml

services:
  nginx:
    image: nginx:alpine
    container_name: portrai_nginx
    profiles: [services,proxy]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - proxy
      - back
    restart: unless-stopped
  portrai_backend:
    build:
      context: ./backend
      dockerfile: dockerfile.integration
    container_name: portrai_backend_integration
    profiles: [app]
    image: portrai_backend:integration
    networks:
      - back
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      PORT: ${BACKEND_PORT}
      LOG_FILEPATH: ${LOG_FILEPATH}
      NODE_ENV: integration
      
      # DATABASE CONF
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      
      # CACHE CONF
      DRAGONFLY_PASSWORD: ${DRAGONFLY_PASSWORD}
      DRAGONFLY_ADDR: ${DRAGONFLY_ADDR}
      DRAGONFLY_PORT: ${DRAGONFLY_PORT}
      DRAGONFLY_USER: ${DRAGONFLY_USER}
      
      # SECRETS
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      COOKIES_ENCRYPTION_KEY: ${COOKIES_ENCRYPTION_KEY}
      KONG_AUTH_HOST: ${KONG_AUTH_HOST}
      KONG_AUTH_PORT: ${KONG_AUTH_PORT}
      GOTRUE_AUTH_HOST: ${GOTRUE_AUTH_HOST}
      GOTRUE_AUTH_PORT: ${GOTRUE_AUTH_PORT}
    restart: always

  portrai_frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.integration
      args:
        - BACKEND_URL=${BACKEND_URL:-/api/v1}
        - NODE_ENV=production
        - API_URL=${BACKEND_URL:-/api/v1}
        - GOOGLE_CLIENT_ID=${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}
    container_name: portrai_frontend_integration
    profiles: [app]
    image: portrai_frontend:integration
    ports:
      - "${FRONTEND_PORT:-5050}:80"
    networks:
      - proxy
    environment:
      - NODE_ENV=production
      - API_URL=${BACKEND_URL:-/api/v1}
      - GOOGLE_CLIENT_ID=${GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID}
    depends_on:
      - portrai_backend
    restart: always

networks:
  proxy:
    name: portrai_proxy_network  
  back:
    name: portrai_back_network  