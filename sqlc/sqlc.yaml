version: "2"
sql:
  - schema: "schema/init.sql"
    queries: "queries/"
    engine: "postgresql"
    gen:
      go:
        package: "sqlc_gen"
        out: "../backend/sqlc_gen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        emit_prepared_queries: true
        json_tags_case_style: "snake"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"