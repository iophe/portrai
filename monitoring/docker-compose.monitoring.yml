services:
  portrai_prometheus:
    image: prom/prometheus:latest
    container_name: portrai_prometheus
    profiles: [services,monitoring]

    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - portrai_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  portrai_grafana:
    image: grafana/grafana:latest
    container_name: portrai_grafana
    profiles: [services,monitoring]
    ports:
      - "3450:3000"
    volumes:
      - portrai_grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    depends_on:
      - portrai_prometheus

volumes:
  portrai_prometheus_data:
  portrai_grafana_data:

networks:
  portrai_monitoring:
    driver: bridge