auth_enabled: false  # Désactiver l'authentification pour une utilisation locale

server:
  http_listen_port: 3100  # Port d'écoute de Loki

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # Ne pas accepter des logs vieux de plus de 7 jours

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem

chunk_store_config:
  max_look_back_period: 0s

table_manager:
  retention_deletes_enabled: true
  retention_period: 7d  # Conservation des logs pendant 7 jours

query_range:
  align_queries_with_step: true
  max_retries: 5
  cache_results: true

frontend:
  log_queries_longer_than: 5s
  compress_responses: true
  max_outstanding_per_tenant: 2048

frontend_worker:
  frontend_address: 127.0.0.1:9095
