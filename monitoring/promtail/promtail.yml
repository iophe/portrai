server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://portrai_loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: "portrai_backend"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "portrai_backend"
          __path__: /var/lib/docker/containers/*-portrai_backend-*.log

  - job_name: "portrai_nginx"
    static_configs:
      - targets:
          - localhost
        labels:
          job: "portrai_nginx"
          __path__: /var/lib/docker/containers/*-portrai_nginx-*.log

