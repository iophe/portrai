global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['portrai_prometheus:9090']

  - job_name: 'cv-generator'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['portrai_backend:3000'] 
        labels:
          service: 'cv-generator'
          env: 'development'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['portrai_node_exporter:9100']
        labels:
          service: 'node-exporter'
          env: 'development'